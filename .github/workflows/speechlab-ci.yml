name: SpeechLab CI
on:
  push:
    paths:
      - 'speechlab/**'
      - '.github/workflows/speechlab-ci.yml'
  pull_request:
    paths:
      - 'speechlab/**'
      - '.github/workflows/speechlab-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speechlab/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
