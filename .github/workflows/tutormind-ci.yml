name: TutorMind CI
on:
  push:
    paths:
      - 'tutormind/**'
      - '.github/workflows/tutormind-ci.yml'
  pull_request:
    paths:
      - 'tutormind/**'
      - '.github/workflows/tutormind-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutormind/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
